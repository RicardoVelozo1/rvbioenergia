<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" width="100%" height="100%">
  <defs>
    <style>
      .cls-blue { fill: #383B96; }
      .cls-green { fill: #00A859; }
      .cls-text-blue { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-weight: 800; font-size: 38px; fill: #383B96; letter-spacing: -0.5px; }
      .cls-text-green { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-weight: 600; font-size: 20px; fill: #00A859; letter-spacing: 2px; }
    </style>
  </defs>
  <!-- Symbol: 3 Blue Circles with Green Leaf Swoosh -->
  <g transform="translate(145, 10)">
    <!-- Top circle -->
    <circle cx="55" cy="24" r="21" class="cls-blue" />
    <!-- Bottom left circle -->
    <circle cx="28" cy="62" r="21" class="cls-blue" />
    <!-- Bottom right circle -->
    <circle cx="82" cy="62" r="21" class="cls-blue" />
    <!-- Green dynamic swoosh leaf -->
    <path d="M-15 72 C25 64, 75 42, 105 18 C85 34, 40 54, -15 62 Z" class="cls-green" />
    <path d="M-18 70 C20 62, 70 40, 102 18 C70 38, 20 58, -18 70 Z" class="cls-green" />
  </g>
  <!-- Typography -->
  <text x="200" y="132" text-anchor="middle" class="cls-text-blue">USINA LAGUNA</text>
  <text x="200" y="162" text-anchor="middle" class="cls-text-green">energia renovável</text>
</svg>
