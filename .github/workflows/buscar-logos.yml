name: Buscar logos de parceiros
on:
  workflow_dispatch:
jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python tools/buscar_logos.py
      - name: Publicar candidatos em branch separada
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "RV Bioenergia Bot"
          git checkout -B logos-candidatos
          git add -f candidatos
          git commit -m "Candidatos a logos"
          git push -f origin logos-candidatos
