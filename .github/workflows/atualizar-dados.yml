name: Atualizar Dados de Mercado

on:
  schedule:
   - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Executar coletor de dados
        run: python coletor.py

      - name: Verificar se dados foram gerados
        run: |
          if [ -f "dados-mercado.json" ]; then
            echo "✓ dados-mercado.json gerado com sucesso"
          else
            echo "✗ ERRO: dados-mercado.json não foi gerado"
            exit 1
          fi

      - name: Commit e push dos dados atualizados
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "RV Bioenergia Bot"
          git add dados-mercado.json
          git diff --staged --quiet || git commit -m "🤖 Dados atualizados: $(date +'%d/%m/%Y %H:%M')"
          git push
